<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Português desde zero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#F2F5FA;--surface:#fff;--ink:#14213D;--muted:#5A6785;--blue:#1F4DB0;--blue-soft:#DCE6F8;--gold:#E3A008;--ok:#1E8E5A;--bad:#C23B3B;--line:#C9D4EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1630;--surface:#16213F;--ink:#EAF0FF;--muted:#9FB0D6;--blue:#7FA2F5;--blue-soft:#223461;--gold:#F2B73A;--ok:#4CC88C;--bad:#F07C7C;--line:#2B3C6B}}
:root[data-theme="dark"]{--bg:#0E1630;--surface:#16213F;--ink:#EAF0FF;--muted:#9FB0D6;--blue:#7FA2F5;--blue-soft:#223461;--gold:#F2B73A;--ok:#4CC88C;--bad:#F07C7C;--line:#2B3C6B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 18px 56px}
h1{font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.02;margin:.2em 0 .3em;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;margin:.2em 0 .4em;font-weight:800}
p{margin:.4em 0}
.muted{color:var(--muted)}
.tiles{height:64px;border-radius:14px;margin-bottom:18px;background:
conic-gradient(from 45deg at 50% 50%,var(--blue) 0 25%,var(--surface) 0 50%,var(--blue) 0 75%,var(--surface) 0) 0 0/32px 32px;border:2px solid var(--blue)}
.unit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;color:inherit;font:inherit;cursor:pointer}
.unit:hover{border-color:var(--blue)}
.unit .emoji{font-size:1.8rem}
.unit b{display:block;font-size:1.1rem}
.badge{margin-left:auto;font-weight:600;color:var(--ok);white-space:nowrap}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--blue);color:var(--bg);border:0;border-radius:12px;padding:12px 20px;font-weight:600;font-size:1rem}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.word{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.word .pt{font-size:1.25rem;font-weight:800;color:var(--blue)}
.word .es{color:var(--muted)}
.say{margin-left:auto;background:var(--blue-soft);color:var(--blue);border:0;border-radius:50%;width:42px;height:42px;font-size:1.1rem}
.tip{background:var(--blue-soft);border-left:6px solid var(--gold);border-radius:10px;padding:12px 14px;margin:16px 0}
.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.q{font-size:1.9rem;font-weight:800;margin:.5em 0}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--blue)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:6px 0}
.letter{background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:22px;margin-top:16px;font-size:1.1rem;white-space:pre-line}
@media (prefers-reduced-motion:no-preference){.letter{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ✏️ PERSONALIZA ESTO: nombre y mensaje final
var HIS_NAME = "mi amor";
var DEDICATION = "Para " + HIS_NAME + ":\n\nHas aprendido tus primeras palavras em português, e yo no podría estar más orgullosa de ti.\n\nAmo-te. 💙\n\n(Escribe aquí tu mensaje personal.)";

var UNITS = [
{id:"ola",emoji:"👋",title:"Olá! Saludos",tip:"Obrigado lo dice un hombre y obrigada una mujer: la palabra concuerda con quien habla. Y la «ç» suena como una «s».",
 w:[["Olá","Hola"],["Bom dia","Buenos días"],["Boa tarde","Buenas tardes"],["Boa noite","Buenas noches"],["Obrigado / Obrigada","Gracias"],["Por favor","Por favor"],["Adeus","Adiós"],["Desculpe","Perdón"]]},
{id:"eu",emoji:"🙋",title:"Eu e tu",tip:"En Portugal se usa «tu» entre amigos y pareja, y «você» es más distante. Fíjate en que el pronombre «eu» se suele omitir: «sou» ya significa «yo soy».",
 w:[["Eu","Yo"],["Tu","Tú"],["Ele","Él"],["Ela","Ella"],["Nós","Nosotros"],["Eu sou","Yo soy"],["Tu és","Tú eres"],["Chamo-me","Me llamo"]]},
{id:"num",emoji:"🔢",title:"Números do 1 ao 10",tip:"«Três» y «seis» llevan una «s» final que suena como «sh» en Portugal. Y «dois» se pronuncia casi «doish».",
 w:[["Um","Uno"],["Dois","Dos"],["Três","Tres"],["Quatro","Cuatro"],["Cinco","Cinco"],["Seis","Seis"],["Sete","Siete"],["Oito","Ocho"],["Nove","Nueve"],["Dez","Diez"]]},
{id:"comida",emoji:"🥖",title:"Comida e bebida",tip:"Las vocales nasales (ão, ões) no existen en español: la «ã» se pronuncia por la nariz, como en «pão». Escúchalo con el botón 🔊.",
 w:[["Água","Agua"],["Pão","Pan"],["Café","Café"],["Leite","Leche"],["Queijo","Queso"],["Peixe","Pescado"],["Maçã","Manzana"],["Vinho","Vino"]]},
{id:"conversa",emoji:"💬",title:"Conversa básica",tip:"Entre amigos y pareja se usa «tu»: «Como estás?», «De onde és?». Y «Prazer» (placer) es lo que dices al conocer a alguien.",
 w:[["Como estás?","¿Cómo estás?"],["Estou bem, obrigado / obrigada","Estoy bien, gracias"],["E tu?","¿Y tú?"],["Tudo bem?","¿Todo bien?"],["Prazer em conhecer-te","Encantado/a de conocerte"],["De onde és?","¿De dónde eres?"],["Sou de Espanha","Soy de España"],["Falo um pouco de português","Hablo un poco de portugués"],["Até logo","Hasta luego"]]},
{id:"perguntas",emoji:"❓",title:"Perguntas",tip:"Cuando «quê» va solo o al final de la frase lleva acento circunflejo: «O quê?». Y «Porquê?» (con ê, para preguntar) no es lo mismo que «porque» (para responder).",
 w:[["Quem?","¿Quién?"],["O quê?","¿Qué?"],["Onde?","¿Dónde?"],["Quando?","¿Cuándo?"],["Porquê?","¿Por qué?"],["Como?","¿Cómo?"],["Quanto?","¿Cuánto?"],["Qual?","¿Cuál?"]]},
{id:"verbos",emoji:"⚙️",title:"Verbos essenciais",tip:"Casi todos se parecen al español. Para «hay» se dice «há»: «Há uma farmácia aqui?». Y «ter» (tener) también sirve para decir la edad: «Tenho 20 anos».",
 w:[["Ser","Ser"],["Estar","Estar"],["Ter","Tener"],["Ir","Ir"],["Fazer","Hacer"],["Querer","Querer"],["Poder","Poder"],["Falar","Hablar"],["Há","Hay"]]},
{id:"dias",emoji:"📅",title:"Dias da semana",tip:"De lunes a viernes llevan «-feira» al final. Sábado y domingo son como en español. Se suele abreviar: «2.ª feira» es el lunes.",
 w:[["Segunda-feira","Lunes"],["Terça-feira","Martes"],["Quarta-feira","Miércoles"],["Quinta-feira","Jueves"],["Sexta-feira","Viernes"],["Sábado","Sábado"],["Domingo","Domingo"],["Fim de semana","Fin de semana"]]},
{id:"cores",emoji:"🎨",title:"Cores",tip:"Para el color negro se usa «preto». Y «amarelo» se pronuncia con la «l» final muy suave, casi como una «u».",
 w:[["Vermelho","Rojo"],["Azul","Azul"],["Verde","Verde"],["Amarelo","Amarillo"],["Branco","Blanco"],["Preto","Negro"],["Laranja","Naranja"],["Cor-de-rosa","Rosa"]]},
{id:"familia",emoji:"👨‍👩‍👧",title:"Família",tip:"Fíjate en las tildes: «avó» (abuela, con ó abierta) y «avô» (abuelo, con ô cerrada). Y «irmão» tiene la ã nasal.",
 w:[["Mãe","Madre"],["Pai","Padre"],["Irmão","Hermano"],["Irmã","Hermana"],["Avó","Abuela"],["Avô","Abuelo"],["Filho","Hijo"],["Filha","Hija"],["Tio","Tío"],["Tia","Tía"]]},
{id:"emocoes",emoji:"😊",title:"Emoções e sensações",tip:"Donde en español se usa «tener» (tengo hambre, frío…), en portugués se dice «estar com»: «Estou com fome», literalmente «estoy con hambre».",
 w:[["Feliz","Feliz"],["Triste","Triste"],["Cansado / Cansada","Cansado / Cansada"],["Estou com fome","Tengo hambre"],["Estou com sede","Tengo sed"],["Estou com sono","Tengo sueño"],["Estou com frio","Tengo frío"],["Estou com calor","Tengo calor"]]},
{id:"frases",emoji:"🗺️",title:"Frases úteis",tip:"En Portugal el baño es «casa de banho» (banheiro es del portugués de Brasil). Y ojo: «percebo» significa «entiendo», no «percibo». Para preguntar dónde está algo se dice «Onde fica…?».",
 w:[["Onde fica a casa de banho?","¿Dónde está el baño?"],["Quanto custa?","¿Cuánto cuesta?"],["Não percebo","No entiendo"],["Pode repetir, por favor?","¿Puede repetir, por favor?"],["Fala espanhol?","¿Habla español?"],["Como se diz…?","¿Cómo se dice…?"],["A conta, por favor","La cuenta, por favor"],["Que horas são?","¿Qué hora es?"],["Pode ajudar-me?","¿Puede ayudarme?"],["Estou perdido / perdida","Estoy perdido / perdida"]]},
{id:"restaurante",emoji:"🍽️",title:"No restaurante",tip:"La carta se llama «ementa». Si pides «um café» en Portugal te sirven un espresso (en Lisboa lo llaman «bica»). Y para brindar: «Saúde!».",
 w:[["Uma mesa para dois","Una mesa para dos"],["A ementa, por favor","La carta, por favor"],["Queria um café","Quería un café"],["Uma água sem gás","Un agua sin gas"],["Está delicioso","Está delicioso"],["Saúde!","¡Salud!"],["Bom apetite!","¡Buen provecho!"]]},
{id:"direcoes",emoji:"🧭",title:"Direções",tip:"«À esquerda» y «à direita» llevan «à» porque es «a + a». Para pedir indicaciones: «Onde fica…?».",
 w:[["À esquerda","A la izquierda"],["À direita","A la derecha"],["Em frente","Todo recto"],["Perto","Cerca"],["Longe","Lejos"],["Aqui","Aquí"],["Ali","Allí"],["Rua","Calle"]]},
{id:"transportes",emoji:"🚋",title:"Transportes",tip:"En Portugal: «comboio» (tren), «autocarro» (autobús) y «elétrico» (tranvía, como el famoso de Lisboa). La «lh» de «bilhete» suena parecida a la «ll» del español.",
 w:[["Comboio","Tren"],["Autocarro","Autobús"],["Elétrico","Tranvía"],["Metro","Metro"],["Aeroporto","Aeropuerto"],["Estação","Estación"],["Bilhete","Billete"],["Táxi","Taxi"]]},
{id:"tempo",emoji:"⛅",title:"Tempo e clima",tip:"Para el clima se usa «estar»: «Está sol», «Está frio». Y en Portugal el gerundio se sustituye por «estar a + infinitivo»: «Está a chover» (está lloviendo).",
 w:[["Sol","Sol"],["Chuva","Lluvia"],["Vento","Viento"],["Frio","Frío"],["Calor","Calor"],["Hoje","Hoy"],["Amanhã","Mañana"],["Ontem","Ayer"]]},
{id:"casa",emoji:"🏠",title:"Em casa",tip:"Ojo: «quarto» significa habitación o dormitorio, no «cuarto» como fracción. Y ya conoces «casa de banho», el baño.",
 w:[["Casa","Casa"],["Quarto","Habitación"],["Cozinha","Cocina"],["Sala","Salón"],["Casa de banho","Baño"],["Cama","Cama"],["Janela","Ventana"],["Porta","Puerta"]]},
{id:"roupa",emoji:"👕",title:"Roupa e compras",tip:"«Calças» y «sapatos» se usan casi siempre en plural. Y para probarte algo se dice «experimentar»: «Posso experimentar?».",
 w:[["Camisa","Camisa"],["Calças","Pantalones"],["Sapatos","Zapatos"],["Casaco","Abrigo / chaqueta"],["Vestido","Vestido"],["Tamanho","Talla"],["Mais barato","Más barato"],["Posso experimentar?","¿Puedo probármelo?"]]},
{id:"falsos",emoji:"⚠️",title:"Falsos amigos",tip:"Son palabras que se parecen al español pero engañan. Aprenderlas pronto te evita malentendidos muy divertidos.",
 w:[["Esquisito","Raro"],["Escritório","Oficina / despacho"],["Polvo","Pulpo"],["Largo","Ancho"],["Salada","Ensalada"],["Copo","Vaso"]]},
{id:"amor",emoji:"💙",title:"Amor e amizade",tip:"En Portugal el pronombre va pegado al verbo con un guion: «Amo-te». Y «saudade» (nostalgia por alguien) es la palabra más portuguesa que hay.",
 w:[["Amo-te","Te quiero / te amo"],["Gosto de ti","Me gustas"],["Tenho saudades tuas","Te echo de menos"],["Beijo","Beso"],["Abraço","Abrazo"],["Coração","Corazón"],["Namorado","Novio"],["Linda","Guapa"]]}
];

var mem = {}, store = {
 get:function(){try{return JSON.parse(localStorage.getItem("pt-prog")||"{}")}catch(e){return mem}},
 set:function(o){mem=o;try{localStorage.setItem("pt-prog",JSON.stringify(o))}catch(e){}}
};
var S = {view:"home",unit:null,qs:[],i:0,score:0,answered:false};
var app = document.getElementById("app");
var $ = function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function say(t){try{var u=new SpeechSynthesisUtterance(t.split(" / ")[0]);u.lang="pt-PT";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function done(){var p=store.get();return UNITS.filter(function(u){return p[u.id]!=null}).length}

function home(){
 var p=store.get(),n=done();
 var h='<div class="tiles" role="presentation"></div><h1>Português desde zero</h1><p class="muted">Portugués de Portugal para hispanohablantes. Lee, escucha y practica: aprueba cada unidad con 4 aciertos de 6.</p>';
 h+='<div class="bar"><i style="width:'+(n/UNITS.length*100)+'%"></i></div><p class="muted">'+n+' de '+UNITS.length+' unidades completadas</p>';
 UNITS.forEach(function(u){h+='<button class="unit" data-go="'+u.id+'"><span class="emoji">'+u.emoji+'</span><span><b>'+u.title+'</b><span class="muted">'+u.w.length+' palabras</span></span>'+(p[u.id]!=null?'<span class="badge">✓ '+p[u.id]+'/6</span>':'')+'</button>'});
 if(n===UNITS.length)h+='<div class="row"><button class="btn" data-final>Abrir mi sorpresa 🎁</button></div>';
 return h;
}
function lesson(u){
 var h='<div class="top"><button class="link" data-home>← Unidades</button></div><h2>'+u.emoji+' '+u.title+'</h2><p class="muted">Toca 🔊 para escuchar cada palabra.</p>';
 u.w.forEach(function(w,i){h+='<div class="word"><div><div class="pt">'+$(w[0])+'</div><div class="es">'+$(w[1])+'</div></div><button class="say" data-say="'+i+'" aria-label="Escuchar '+$(w[0])+'">🔊</button></div>'});
 h+='<div class="tip"><b>Ojo:</b> '+u.tip+'</div><div class="row"><button class="btn" data-quiz>Empezar el test</button></div>';
 return h;
}
function startQuiz(u){
 var all=[];UNITS.forEach(function(x){all=all.concat(x.w)});
 S.qs=shuffle(u.w).slice(0,6).map(function(w,k){
  var rev=k%2===1,a=rev?1:0,b=rev?0:1;
  var d=shuffle(all.filter(function(x){return x[b]!==w[b]})).slice(0,3).map(function(x){return x[b]});
  return {q:w[a],ans:w[b],opts:shuffle(d.concat([w[b]])),pt:!rev};
 });
 S.i=0;S.score=0;S.answered=false;S.view="quiz";
}
function quiz(){
 var q=S.qs[S.i],h='<div class="top"><button class="link" data-home>← Salir</button><span class="muted">'+(S.i+1)+' / '+S.qs.length+'</span></div><div class="bar"><i style="width:'+(S.i/S.qs.length*100)+'%"></i></div>';
 h+='<p class="muted">'+(q.pt?'¿Qué significa en español?':'¿Cómo se dice en portugués?')+'</p><div class="q">'+$(q.q)+(q.pt?' <button class="say" data-sayq aria-label="Escuchar">🔊</button>':'')+'</div>';
 q.opts.forEach(function(o){h+='<button class="opt" data-opt="'+$(o).replace(/"/g,"&quot;")+'">'+$(o)+'</button>'});
 h+='<div id="fb"></div>';
 return h;
}
function result(){
 var u=S.unit,ok=S.score>=4,h='<h2>'+(ok?'¡Unidade completa! 🎉':'Casi, casi…')+'</h2><p class="q">'+S.score+' / '+S.qs.length+'</p>';
 h+='<p>'+(ok?'Has aprobado «'+u.title+'». Sigue así.':'Necesitas 4 aciertos para aprobar. Repasa la lección y vuelve a intentarlo.')+'</p><div class="row">';
 h+='<button class="btn" data-quiz>Repetir test</button><button class="btn ghost" data-lesson>Ver lección</button><button class="btn ghost" data-home>Unidades</button></div>';
 return h;
}
function final(){return '<div class="tiles"></div><h2>🎁 Tu sorpresa</h2><div class="letter">'+$(DEDICATION)+'</div><div class="row"><button class="btn ghost" data-home>Volver</button></div>'}

function render(){
 app.innerHTML=S.view==="home"?home():S.view==="lesson"?lesson(S.unit):S.view==="quiz"?quiz():S.view==="result"?result():final();
 window.scrollTo(0,0);
}
app.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;var d=t.dataset;
 if(d.go!==undefined){S.unit=UNITS.filter(function(u){return u.id===d.go})[0];S.view="lesson";render()}
 else if(d.home!==undefined){S.view="home";render()}
 else if(d.lesson!==undefined){S.view="lesson";render()}
 else if(d.final!==undefined){S.view="final";render()}
 else if(d.quiz!==undefined){startQuiz(S.unit);render()}
 else if(d.say!==undefined){say(S.unit.w[+d.say][0])}
 else if(d.sayq!==undefined){say(S.qs[S.i].q)}
 else if(d.next!==undefined){
  if(S.i+1<S.qs.length){S.i++;S.answered=false;render()}
  else{if(S.score>=4){var p=store.get();p[S.unit.id]=Math.max(p[S.unit.id]||0,S.score);store.set(p)}S.view="result";render()}
 }
 else if(d.opt!==undefined&&!S.answered){
  S.answered=true;var q=S.qs[S.i],right=d.opt===q.ans;if(right)S.score++;
  app.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(b.dataset.opt===q.ans)b.classList.add("ok");else if(b===t)b.classList.add("bad")});
  document.getElementById("fb").innerHTML='<p><b>'+(right?'¡Correcto!':'Era: '+$(q.ans))+'</b></p><div class="row"><button class="btn" data-next>'+(S.i+1<S.qs.length?'Siguiente':'Ver resultado')+'</button></div>';
 }
});
render();
</script>
</body>
</html>
